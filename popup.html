<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>mltx</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>mltx</h1>

    <label class="row stack" for="mute">
      <span>屏蔽词</span>
      <textarea id="mute" rows="4" spellcheck="false" placeholder="每行一个，也可以用逗号分开"></textarea>
      <small>正文、作者或链接卡片含这些词的帖子不显示，不分大小写。你点开的帖子和它的上文不受影响。</small>
    </label>

    <fieldset class="row">
      <legend>默认流向</legend>
      <div class="segments">
        <label><input type="radio" name="flow" value="v" /><span>竖向</span></label>
        <label><input type="radio" name="flow" value="h" /><span>横向</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>主题</legend>
      <div class="segments">
        <label><input type="radio" name="theme" value="auto" /><span>跟随 X</span></label>
        <label><input type="radio" name="theme" value="dark" /><span>黑色</span></label>
        <label><input type="radio" name="theme" value="light" /><span>白色</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>左栏链接</legend>
      <div class="segments">
        <label><input type="radio" name="panel" value="sheet" /><span>侧边面板</span></label>
        <label><input type="radio" name="panel" value="same" /><span>当前页跳转</span></label>
        <label><input type="radio" name="panel" value="tab" /><span>新标签页</span></label>
      </div>
    </fieldset>

    <label class="row inline" for="panelKeep">
      <span>侧边面板内容刷新时间</span>
      <select id="panelKeep">
        <option value="0">不刷新</option>
        <option value="1">1 分钟</option>
        <option value="5">5 分钟</option>
        <option value="15">15 分钟</option>
        <option value="30">30 分钟</option>
        <option value="60">1 小时</option>
      </select>
    </label>

    <label class="row inline" for="cols">
      <span>列数</span>
      <select id="cols">
        <option value="0">自动</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </label>

    <p class="note" id="note" hidden>切换主题时，打开的 X 页面会自动刷新。</p>

    <script src="popup.js"></script>
  </body>
</html>
