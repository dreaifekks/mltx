<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>mltx</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>mltx</h1>

    <label class="row stack" for="mute">
      <span data-i18n="mute"></span>
      <textarea id="mute" rows="4" spellcheck="false"></textarea>
      <small data-i18n="muteHint"></small>
    </label>

    <fieldset class="row">
      <legend data-i18n="flow"></legend>
      <div class="segments">
        <label><input type="radio" name="flow" value="v" /><span data-i18n="flowV"></span></label>
        <label><input type="radio" name="flow" value="h" /><span data-i18n="flowH"></span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend data-i18n="theme"></legend>
      <div class="segments">
        <label><input type="radio" name="theme" value="auto" /><span data-i18n="themeAuto"></span></label>
        <label><input type="radio" name="theme" value="dark" /><span data-i18n="themeDark"></span></label>
        <label><input type="radio" name="theme" value="light" /><span data-i18n="themeLight"></span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend data-i18n="panel"></legend>
      <div class="segments">
        <label><input type="radio" name="panel" value="sheet" /><span data-i18n="panelSheet"></span></label>
        <label><input type="radio" name="panel" value="same" /><span data-i18n="panelSame"></span></label>
        <label><input type="radio" name="panel" value="tab" /><span data-i18n="panelTab"></span></label>
      </div>
    </fieldset>

    <label class="row inline" for="panelKeep">
      <span data-i18n="panelKeep"></span>
      <select id="panelKeep">
        <option value="0" data-i18n="keep0"></option>
        <option value="1" data-i18n="keep1"></option>
        <option value="5" data-i18n="keep5"></option>
        <option value="15" data-i18n="keep15"></option>
        <option value="30" data-i18n="keep30"></option>
        <option value="60" data-i18n="keep60"></option>
      </select>
    </label>

    <label class="row inline" for="cols">
      <span data-i18n="cols"></span>
      <select id="cols">
        <option value="0" data-i18n="colsAuto"></option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </label>

    <label class="row inline" for="lang">
      <span data-i18n="lang"></span>
      <select id="lang">
        <option value="auto" data-i18n="langAuto"></option>
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </label>

    <p class="note" id="note" data-i18n="themeNote" hidden></p>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
